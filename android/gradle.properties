# Flutter's template asks for -Xmx8G and a 4G metaspace. On a 16GB machine that
# is already running an IDE and a browser, the daemon plus its dex workers then
# ask for more than the OS can serve, and the build stalls in D8 rather than
# failing outright — which is much harder to diagnose than an OOM would be.
#
# 3G heap and 1G metaspace comfortably build this project (about 120 plugin
# dependencies, core-library desugaring enabled) and leave room for the workers.
# Raise it on a machine with headroom; do not raise it past what is actually
# free.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true

# Parallel task execution across modules. Safe here and a meaningful saving with
# this many plugin modules.
org.gradle.parallel=true

# Reuse task outputs between builds. The first build pays full price; later ones
# skip everything unchanged.
org.gradle.caching=true
