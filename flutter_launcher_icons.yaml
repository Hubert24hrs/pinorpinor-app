# Launcher icons, generated from the artwork in tool/generate_brand_images_test.dart.
#
#   flutter test tool/generate_brand_images_test.dart   # redraw the source PNGs
#   dart run flutter_launcher_icons                      # regenerate platform icons
flutter_launcher_icons:
  image_path: "assets/brand/app_icon.png"

  android: "ic_launcher"
  # Adaptive icon: the launcher composes the foreground over this background and
  # applies its own mask. The background is the brand rose so the icon still
  # reads as Pinorpinor under a circular mask that crops the gradient's corners.
  adaptive_icon_background: "#C2446E"
  adaptive_icon_foreground: "assets/brand/app_icon_foreground.png"
  min_sdk_android: 23

  ios: true
  # iOS rejects an app icon containing transparency, so the alpha channel is
  # flattened rather than left for App Store Connect to reject at upload.
  remove_alpha_ios: true
