# Static analysis configuration.
#
#   flutter analyze
#
# The baseline is `flutter_lints`. The additions below are the rules that catch
# the mistakes this app can actually make: leaking a session or a payload into a
# log, letting an unawaited future swallow an error, or reusing a BuildContext
# after an await. Each one is treated as an error rather than a hint, because a
# warning nobody reads is not a control.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Nothing in this app may print. Logging goes through AppLog, which is
    # compiled out of release builds and never accepts a payload.
    avoid_print: error

    # Using a BuildContext after an await is how a screen ends up talking to a
    # disposed widget. It has already been caught twice here.
    use_build_context_synchronously: error

    # An unhandled future is a silently swallowed API error.
    unawaited_futures: error

    # Dead code and unused imports are usually the residue of a half-finished
    # change; they should not survive review.
    unused_import: error
    unused_local_variable: error
    dead_code: error

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Every dependency is injected through a provider, so an unawaited future is
    # always a mistake rather than fire-and-forget by design. Where it genuinely
    # is intentional, `unawaited(...)` says so explicitly.
    unawaited_futures: true

    # Const constructors matter on a list of profile cards that rebuilds on
    # every scroll frame.
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true

    prefer_final_locals: true
    always_declare_return_types: true

    # Catching a bare Error hides a programming mistake among the network ones.
    avoid_catching_errors: true

    # Deliberately NOT enabled: `avoid_redundant_argument_values`. Passing a
    # value that happens to match a default is often the clearer choice —
    # `Validators.phone(value, required: true)` at a call site where optionality
    # is the point, or an explicit `now` in a date test. The rule would trade
    # readable intent for a shorter line.
